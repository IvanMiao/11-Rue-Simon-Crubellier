<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A3 · 章节房间</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Courier+Prime&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
      body { font-family: 'Noto Serif SC', 'Noto Serif CJK SC', serif; }
      header { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; margin: 22px; padding: 14px 18px; background: var(--paper); border: 1px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
      .eyebrow, nav, footer { font-family: 'Courier Prime', monospace; letter-spacing: 0.12em; }
      .eyebrow { font-size: 11px; }
      h1 { margin: 4px 0; font-size: 22px; }
      p { margin: 0; font-size: 12px; }
      nav { display: flex; gap: 8px; flex-wrap: wrap; }
      nav a { padding: 8px 11px; color: var(--ink); border: 1px solid var(--ink); text-decoration: none; font-size: 11px; }
      nav a:hover, nav a:focus-visible, nav a[aria-current='page'] { color: var(--paper); background: var(--ink); }
      #cells-stage { display: grid; grid-template-columns: repeat(4, minmax(358px, 1fr)); gap: 16px; padding: 0 16px 24px; }
      .contact-tile { min-width: 0; margin: 0; padding: 8px; background: var(--paper); border: 1px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
      .contact-tile canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: var(--paper); border: 1px solid var(--ink); }
      .contact-label { min-height: 2.8rem; margin: 8px 2px 0; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
      .contact-tile:nth-child(4n) { margin-right: 0; }
      footer { margin: 16px 22px 24px; padding: 10px 14px; font-size: 11px; }
      @media (max-width: 1511px) {
        #cells-stage { grid-template-columns: repeat(auto-fit, minmax(min(100%, 358px), 1fr)); }
      }
      @media (max-width: 760px) {
        header { align-items: flex-start; flex-direction: column; }
        #cells-stage { grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="eyebrow">11, rue Simon-Crubellier · A3 纸剧场</div>
        <h1>章节房间 · 20:00</h1>
        <p>案卷房间 · 三间空房 · 缺掉的一格</p>
      </div>
      <nav aria-label="灯光与印刷模式">
        <a href="/cells.html">20:00</a>
        <a href="/cells.html?hour=23">23:00</a>
        <a href="/cells.html?mode=blueprint">蓝图</a>
      </nav>
    </header>
    <main id="cells-stage" aria-label="章节房间联系表"></main>
    <footer>A3 · 每格一间房 · 20:00 的光与 23:00 的夜</footer>
    <script type="module" src="/art/stage/cellsContactSheet.ts"></script>
  </body>
</html>
