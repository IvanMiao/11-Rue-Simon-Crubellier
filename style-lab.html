<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A1 · 纸剧场 × 清线档案</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Courier+Prime&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #1c1a19; --paper: #f3ede0; --paper-deep: #e4d9c2; --accent: #c8372d; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
      body { font-family: 'Noto Serif SC', 'Noto Serif CJK SC', serif; }
      #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .card { position: fixed; background: var(--paper); border: 1.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
      .plate { top: 22px; left: 22px; padding: 12px 18px 14px; min-width: 300px; }
      .eyebrow, .meta, .tag, .legend, button { font-family: 'Courier Prime', monospace; }
      .eyebrow { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.75; }
      h1 { margin: 6px 0 4px; font-size: 24px; font-weight: 900; letter-spacing: 0.04em; }
      .meta { font-size: 12px; letter-spacing: 0.08em; }
      .meta::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
      .views { top: 22px; right: 22px; display: flex; }
      button { background: var(--paper); color: var(--ink); border: 0; border-right: 1.5px solid var(--ink); padding: 9px 16px; font-size: 12px; letter-spacing: 0.18em; cursor: pointer; }
      button:last-child { border-right: 0; }
      .views button:last-of-type { border-right: 0; }
      .views a { display: inline-flex; align-items: center; padding: 9px 16px; border-left: 1.5px solid var(--ink); color: var(--ink); font-family: 'Courier Prime', monospace; font-size: 12px; letter-spacing: 0.18em; text-decoration: none; }
      .views a:hover, .views a:focus-visible { background: var(--ink); color: var(--paper); }
      button.on { background: var(--ink); color: var(--paper); }
      .legend { top: 74px; right: 22px; justify-content: flex-end; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; max-width: 330px; font-size: 10px; }
      .legend i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--ink); margin-right: 5px; vertical-align: -2px; }
      .tag { bottom: 22px; right: 22px; padding: 8px 12px; font-size: 11px; letter-spacing: 0.1em; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <header class="card plate">
      <div class="eyebrow">11, rue Simon-Crubellier · Paris XVII<sup>e</sup></div>
      <h1 id="title">III · 巴特尔布思的工作室</h1>
      <div class="meta" id="meta">1975 年 6 月 23 日 · 20:00 · 时间静止</div>
    </header>
    <nav class="card views"><button data-view="room" class="on">1 房间</button><button data-view="section">2 剖面</button><a href="/cast.html">3 演员表</a><button data-view="props">4 道具库</button></nav>
    <aside class="card legend" id="legend"></aside>
    <footer class="card tag">A2 风格测试 · 纸剧场 × 清线档案</footer>
    <script type="module" src="/art/styleLab.ts"></script>
  </body>
</html>
