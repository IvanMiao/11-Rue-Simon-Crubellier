<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A3 · 全楼剖面</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Courier+Prime&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--desk); color: var(--ink); font-family: 'Noto Serif SC', 'Noto Serif CJK SC', serif; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 18px 22px 12px; padding: 12px 16px; background: var(--paper); border: 1px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 3px 0 0; font-family: 'Courier Prime', monospace; font-size: 11px; }
      nav { display: flex; gap: 6px; font-family: 'Courier Prime', monospace; }
      nav a { padding: 6px 9px; color: var(--ink); border: 1px solid var(--ink); text-decoration: none; font-size: 11px; }
      nav a[aria-current='page'], nav a:hover, nav a:focus-visible { background: var(--ink); color: var(--paper); }
      #building-stage { min-width: 0; min-height: 0; margin: 0 22px 20px; overflow: hidden; background: var(--paper); border: 1px solid var(--ink); box-shadow: 5px 6px 0 color-mix(in srgb, var(--ink) 32%, transparent); }
      #building-stage canvas { display: block; width: 100%; height: 100%; }
      #building-error { display: none; padding: 2rem; }
      @media (max-width: 700px) {
        header { align-items: flex-start; flex-direction: column; margin: 10px 12px; }
        #building-stage { margin: 0 12px 12px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>瓦莱纳的全楼剖面</h1>
        <p>近景 / 邻格 / 全楼 · ?mech=ev-wk-bench&amp;progress=0.5&amp;status=open · lock / closeUp / parallax</p>
      </div>
      <nav aria-label="剖面视图">
        <a href="?view=room">近</a>
        <a href="?view=block">邻</a>
        <a href="?view=building">全楼</a>
      </nav>
    </header>
    <main id="building-stage" aria-label="全楼剖面"></main>
    <div id="building-error" role="alert"></div>
    <script type="module" src="/art/stage/buildingHarness.ts"></script>
  </body>
</html>
